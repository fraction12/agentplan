<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>agentplan — social preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px;
      height: 640px;
      background: #0a0e1a;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .card {
      width: 1280px;
      height: 640px;
      background: #0a0e1a;
      padding: 56px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .brand {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 28px;
      color: #4ade80;
      letter-spacing: -0.5px;
    }
    .brand span {
      color: rgba(255,255,255,0.35);
      margin-left: 16px;
      font-size: 16px;
      font-weight: 400;
    }
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
    }
    .headline {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -1px;
      max-width: 900px;
    }
    .headline em {
      font-style: italic;
      color: #4ade80;
    }
    .subtext {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.45);
    }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .bottom img { height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">⚡ agentplan<span>by fraction12</span></div>
    <div class="center">
      <div class="headline">The task queue your<br><em>AI agents</em> are missing</div>
      <div class="subtext">Zero dependencies · Pure Python · pip install agentplan</div>
    </div>
    <div class="bottom">
      <img src="https://img.shields.io/pypi/v/agentplan?style=flat-square&color=4ade80&labelColor=1a1f2e&label=PyPI" alt="PyPI version">
      <img src="https://img.shields.io/badge/License-MIT-4ade80?style=flat-square&labelColor=1a1f2e" alt="License: MIT">
    </div>
  </div>
</body>
</html>
