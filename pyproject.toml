[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentplan"
version = "0.2.0"
description = "Multi-agent task queue and project planner CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Dushyant Garg", email = "dushyantgarg3@gmail.com"}]
keywords = ["cli", "agent", "project-management", "task-queue", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fraction12/agentplan"
Repository = "https://github.com/fraction12/agentplan"
"Bug Tracker" = "https://github.com/fraction12/agentplan/issues"

[project.scripts]
agentplan = "agentplan:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["agentplan"]
